[workspace]
resolver = "2"
members = [
    "crates/turso_durable",
    "crates/turso-durable-cli",
    "crates/turso-durable-server",
    "crates/turso-durable-hrana-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "json", "uuid", "encryption"] }
turso_parser = "=0.8.3"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
hex = "=0.4.3"
tempfile = "=3.20.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "=0.31.1", default-features = false, features = ["grpc-tonic", "trace", "logs"] }
tracing-opentelemetry = { version = "=0.32.1", default-features = false }
opentelemetry-appender-tracing = "=0.31.1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "signal", "sync"] }
axum = { version = "=0.8.7", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "http1", "service", "server-graceful"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
subtle = "=2.6.1"
