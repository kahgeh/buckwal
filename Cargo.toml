[workspace]
resolver = "2"
members = ["crates/turso_durable", "crates/turso-durable-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "json", "uuid"] }
turso_parser = "=0.8.3"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
hex = "=0.4.3"
tempfile = "=3.20.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace", "logs"] }
opentelemetry-otlp = { version = "=0.31.1", default-features = false, features = ["grpc-tonic", "trace", "logs"] }
tracing-opentelemetry = { version = "=0.32.1", default-features = false }
opentelemetry-appender-tracing = "=0.31.1"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time"] }
